name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing published release tag to retry
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.release-tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
        run: |
          gh release view "$RELEASE_TAG" --json tagName,isPrerelease,isDraft > "$RUNNER_TEMP/release.json"
          node <<'JS'
          const fs = require('node:fs');
          const release = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/release.json', 'utf8'));
          if (release.isDraft) throw new Error('Release must be published');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${release.tagName}\nprerelease=${release.isPrerelease}\n`);
          JS

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install --global npm@12.2.2

      - run: npm ci

      - name: Set package version from release tag
        id: version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
          ACTUAL_VERSION="$(node -p 'require("./package.json").version')"
          test "$ACTUAL_VERSION" = "$VERSION"
          if [[ "$PRERELEASE" == "true" || "$VERSION" == *-* ]]; then
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run lint
      - run: npm run build

      - name: Pack npm artifact
        id: pack
        run: |
          npm pack --json > "$RUNNER_TEMP/npm-pack.json"
          node <<'JS'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/npm-pack.json', 'utf8'));
          // npm 11 returns an array; npm 12 keys results by package name.
          const packages = Object.values(result);
          if (packages.length !== 1 || !packages[0].filename) {
            throw new Error('Expected exactly one npm package archive');
          }
          const filename = packages[0].filename;
          fs.accessSync(filename);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `filename=${filename}\n`);
          JS

      - name: Upload package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PACKAGE_FILE: ${{ steps.pack.outputs.filename }}
        run: gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" --clobber

      - name: Publish package to npm
        env:
          PACKAGE_FILE: ${{ steps.pack.outputs.filename }}
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: npm publish "$PACKAGE_FILE" --access public --provenance --tag "$DIST_TAG"
